<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="두성종이 상품 카탈로그"><title>두성종이 종이백과</title><link rel="stylesheet" href="styles.css"></head><body><header class="top"><div class="brand"><span class="mark">D</span><div><strong>두성종이</strong><small>종이백과</small></div></div><div class="source">2026. 07. 01 가격표 기준</div></header><main><section class="intro"><div><p class="eyebrow">B2B PAPER CATALOG</p><h1>필요한 종이를<br><em>빠르게 찾아보세요.</em></h1><p class="lede">두성종이 취급 상품의 사양과 표준단가를 한눈에 확인할 수 있습니다.</p></div><div class="stat"><b id="count">0</b><span>검색 가능한 상품</span></div></section><section class="uses"><div class="uses-title"><p class="eyebrow">FIND BY USE</p><h2>제작물에 맞춰 골라보세요.</h2></div><button class="use-card active" data-use="shopping"><img src="assets/shopping-bag.png"><span><b>쇼핑백</b><small>150–250g · 크라프트 & 컬러지</small></span></button><button class="use-card" data-use="package"><img src="assets/package-box.png"><span><b>패키지</b><small>260–350g · 탄탄한 패키지용</small></span></button><button class="use-card" data-use="inside"><img src="assets/book-pages.png"><span><b>내지</b><small>60–120g · 가볍고 편안한 지류</small></span></button></section><section class="controls"><label class="search"><span>⌕</span><input id="search" placeholder="종이 이름, 색상, 규격으로 검색" aria-label="종이 검색"><button id="clear" aria-label="검색어 지우기">×</button></label><div class="filter"><label for="group">상품군</label><select id="group"><option value="all">전체 상품군</option></select></div><div class="viewnote" id="summary"></div></section><div id="catalog"></div><div id="empty" class="empty" hidden><div>⌕</div><h2>검색 결과가 없습니다</h2><p>다른 종이 이름이나 색상으로 검색해 보세요.</p></div></main><dialog id="detail"><button class="modal-close" aria-label="닫기">×</button><img id="detail-img"><div class="modal-copy"><p class="eyebrow">PAPER DETAIL</p><h2 id="detail-name"></h2><p id="detail-desc"></p><div id="detail-meta"></div></div></dialog><footer>두성종이 종이백과 <span>•</span> 가격은 부가세 별도이며 실제 발주 시 최신 가격을 확인해 주세요.</footer><script src="data.js"></script><script src="app.js"></script></body></html>
